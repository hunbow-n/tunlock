name: Build Tunlock DMG

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'tunlock-release' || github.run_id }}
  queue: max

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    outputs:
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - name: Determine release version and notes
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "$previous_tag" ]]; then
            if [[ ! "$previous_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Cannot increment release tag $previous_tag" >&2
              exit 1
            fi
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            previous_commit=$(git rev-parse "refs/tags/${previous_tag}^{commit}")
            if git merge-base --is-ancestor "$GITHUB_SHA" "$previous_commit"; then
              echo "This commit is already covered by $previous_tag."
              exit 0
            fi
            if ! git merge-base --is-ancestor "$previous_commit" "$GITHUB_SHA"; then
              echo "This commit does not descend from $previous_tag." >&2
              exit 1
            fi
            range="$previous_commit..$GITHUB_SHA"
          else
            version=$(awk -F= '$1 == "VERSION" { print $2; exit }' bin/tunlock)
            range="$GITHUB_SHA"
          fi

          # Read complete commit messages. A breaking-change footer can appear after the body.
          # Skip merge commits: their "Merge pull request" subject is not a change.
          breaking_header='^[a-z][a-z0-9-]*(\([^)]+\))?!:[[:blank:]]+'
          breaking_footer=$'(^|\n)BREAKING[ -]CHANGE:[[:blank:]]+([^[:space:]][^\n]*)'
          feature_header='^feat(\([^)]+\))?:[[:blank:]]+'
          fix_header='^(fix|perf)(\([^)]+\))?:[[:blank:]]+'
          notes="$RUNNER_TEMP/tunlock-release-notes.md"
          : > "$notes"
          bump=$(git log -z --no-merges --format='%s%x00%b' "$range" | {
            level=0
            while IFS= read -r -d '' subject && IFS= read -r -d '' body; do
              printf -- '- %s\n' "$subject" >> "$notes"
              if [[ "$body" =~ $breaking_footer ]]; then
                printf '  - **Breaking change:** %s\n' "${BASH_REMATCH[2]}" >> "$notes"
                level=3
              elif [[ "$subject" =~ $breaking_header ]]; then
                level=3
              elif [[ $level -lt 2 && "$subject" =~ $feature_header ]]; then
                level=2
              elif [[ $level -eq 0 && "$subject" =~ $fix_header ]]; then
                level=1
              fi
            done
            printf '%s\n' "$level"
          })
          if [[ $bump -eq 0 ]]; then
            echo "No release-triggering commits."
            exit 0
          fi
          if [[ -n "$previous_tag" ]]; then
            if [[ $bump -eq 3 && $major -gt 0 ]]; then
              version="$((major + 1)).0.0"
            elif [[ $bump -ge 2 ]]; then
              version="$major.$((minor + 1)).0"
            else
              version="$major.$minor.$((patch + 1))"
            fi
          fi

          mkdir -p build
          cp "$notes" build/release-notes.md
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "TUNLOCK_BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install shellcheck
        run: brew install shellcheck

      # The system Bash 3.2, the one tunlock runs under on every Mac.
      - name: Run tests
        run: /bin/bash tests/run.sh

      - name: Build universal macOS app
        run: |
          xcodebuild -version
          bash build-app.sh
          architectures=$(lipo -archs build/Tunlock.app/Contents/MacOS/Tunlock)
          echo "Built architectures: $architectures"
          [[ " $architectures " == *" arm64 "* && " $architectures " == *" x86_64 "* ]]
          codesign --verify --deep --strict build/Tunlock.app

      - name: MCP server answers like an agent expects
        run: bash tests/mcp.sh build/Tunlock.app/Contents/MacOS/Tunlock

      - name: Package DMG
        run: |
          mkdir build/dmg
          ditto build/Tunlock.app build/dmg/Tunlock.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Tunlock -srcfolder build/dmg -format UDZO build/Tunlock.dmg
          hdiutil verify build/Tunlock.dmg

      # Signed later, in the release job: this job also runs for pull requests,
      # and a pull request must never reach the release key.
      - name: Checksums
        run: |
          cd build
          shasum -a 256 Tunlock.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tunlock-macOS
          path: |
            build/Tunlock.dmg
            build/SHA256SUMS.txt
            build/release-notes.md
          if-no-files-found: error

  pf-live:
    # Real pf on a throwaway runner: tunlock's rules loaded into the live
    # firewall, checked with real packets. Separate job: it never blocks the DMG.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Real pf behaviour
        run: sudo env TUNLOCK_PF_LIVE=1 GITHUB_ACTIONS=true bash tests/pf-live.sh

  release:
    needs: [build, pf-live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-latest
    # The release key is a secret of this environment, which only main may use
    # (Settings > Environments > release > Deployment branches: main).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          path: src
          sparse-checkout: docs/tunlock-release.pem
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Tunlock-macOS
      - name: Sign checksums (when the release key is set)
        shell: bash
        env:
          RELEASE_KEY: ${{ secrets.TUNLOCK_RELEASE_KEY }}
        run: |
          sha256sum --check SHA256SUMS.txt
          if [[ -z "$RELEASE_KEY" ]]; then
            echo "No release key: SHA256SUMS.txt stays unsigned."
            exit 0
          fi
          pem=src/docs/tunlock-release.pem
          if [[ ! -f "$pem" ]]; then
            echo "TUNLOCK_RELEASE_KEY is set, but docs/tunlock-release.pem is not committed." >&2
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt | base64 -w0 > SHA256SUMS.txt.sig
          echo >> SHA256SUMS.txt.sig
          openssl pkeyutl -verify -pubin -inkey "$pem" -rawin -in SHA256SUMS.txt \
            -sigfile <(base64 -d < SHA256SUMS.txt.sig)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          latest_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ "$latest_tag" != "$PREVIOUS_TAG" ]]; then
            echo "A release was published after this build was prepared. Current release: $latest_tag."
            exit 0
          fi
          sha256sum --check SHA256SUMS.txt
          assets=(Tunlock.dmg SHA256SUMS.txt)
          if [[ -f SHA256SUMS.txt.sig ]]; then
            assets+=(SHA256SUMS.txt.sig)
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          tagged_commit=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            ls-remote "$GITHUB_SERVER_URL/$GH_REPO.git" "$tag_ref" "$tag_ref^{}" \
            | awk 'NR == 1 || /\^\{\}$/ { commit = $1 } END { print commit }')
          if [[ -z "$tagged_commit" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="$tag_ref" -f sha="$GITHUB_SHA" --silent
          elif [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $RELEASE_TAG already points to $tagged_commit instead of $GITHUB_SHA." >&2
            exit 1
          fi

          # gh stages assets in a draft. Resume an interrupted upload for this commit.
          draft=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft and .tag_name == env.RELEASE_TAG) | [.target_commitish, any(.assets[]; .name == "SHA256SUMS.txt.sig")] | @tsv')
          IFS=$'\t' read -r draft_target draft_signed <<< "$draft"
          if [[ -z "$draft_target" ]]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --target "$GITHUB_SHA" \
              --title "Tunlock ${RELEASE_TAG#v}" --notes-file release-notes.md \
              --latest --draft=false --prerelease=false
          elif [[ "$draft_target" == "$GITHUB_SHA" ]]; then
            if [[ "$draft_signed" == true && ! -f SHA256SUMS.txt.sig ]]; then
              echo "Cannot replace a signed draft with an unsigned build." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease=false --latest
          else
            echo "Draft $RELEASE_TAG targets $draft_target instead of $GITHUB_SHA." >&2
            exit 1
          fi
