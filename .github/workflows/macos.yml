name: Build Tunlock DMG

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run tests
        run: bash tests/run.sh

      - name: Build universal macOS app
        run: |
          xcodebuild -version
          bash build-app.sh
          lipo -verify_arch arm64 x86_64 build/Tunlock.app/Contents/MacOS/Tunlock
          codesign --verify --deep --strict build/Tunlock.app

      - name: Package DMG
        run: |
          mkdir build/dmg
          ditto build/Tunlock.app build/dmg/Tunlock.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Tunlock -srcfolder build/dmg -format UDZO build/Tunlock.dmg
          hdiutil verify build/Tunlock.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Tunlock-macOS
          path: build/Tunlock.dmg
          if-no-files-found: error
